<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoPE Intuition</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #fff; color: #111; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 10px 14px 12px; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 10px; }
    .control { border: 1px solid #ddd; border-radius: 8px; padding: 8px; background: #fafafa; }
    .control label { display: block; font-size: 13px; margin-bottom: 6px; }
    .metrics { font-size: 14px; margin: 8px 0 0; }
    #plot { width: 100%; height: 560px; }
    @media (max-width: 900px) { .controls { grid-template-columns: 1fr; } #plot { height: 650px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="controls">
      <div class="control">
        <label>Destination angle theta_d (deg): <b id="tdVal">20</b></label>
        <input id="td" type="range" min="-180" max="180" step="1" value="20" />
      </div>
      <div class="control">
        <label>Source angle theta_s (deg): <b id="tsVal">-40</b></label>
        <input id="ts" type="range" min="-180" max="180" step="1" value="-40" />
      </div>
      <div class="control">
        <label>Condition number (Wq/Wk): <b id="condVal">25</b></label>
        <input id="cond" type="range" min="2" max="900" step="1" value="25" />
      </div>
    </div>
    <div id="plot"></div>
    <div class="metrics" id="metrics"></div>
  </div>

<script>
function deg2rad(d){ return d*Math.PI/180; }
function rot(t){ const c=Math.cos(t), s=Math.sin(t); return [[c,-s],[s,c]]; }
function mm(A,B){ return [[A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],[A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]]; }
function mv(A,v){ return [A[0][0]*v[0]+A[0][1]*v[1],A[1][0]*v[0]+A[1][1]*v[1]]; }
function mtv(A,v){ return [A[0][0]*v[0]+A[1][0]*v[1],A[0][1]*v[0]+A[1][1]*v[1]]; }
function tr(A){ return [[A[0][0],A[1][0]],[A[0][1],A[1][1]]]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]; }
function inv2(A){ const d=A[0][0]*A[1][1]-A[0][1]*A[1][0]; return [[ A[1][1]/d, -A[0][1]/d],[-A[1][0]/d, A[0][0]/d]]; }
function scale2(s1,s2){ return [[s1,0],[0,s2]]; }

const xd=[1.0,0.25], xs=[-0.35,1.0];

function buildW(cond, qang, kang){
  const D=scale2(1,1/cond);
  const Wq=mm(rot(qang), D);
  const Wk=mm(rot(kang), D);
  return {Wq,Wk};
}

function draw(){
  const td = parseFloat(document.getElementById('td').value);
  const ts = parseFloat(document.getElementById('ts').value);
  const cond = parseFloat(document.getElementById('cond').value);
  document.getElementById('tdVal').textContent = String(td);
  document.getElementById('tsVal').textContent = String(ts);
  document.getElementById('condVal').textContent = String(cond);

  const Rd=rot(deg2rad(td));
  const Rs=rot(deg2rad(ts));

  const {Wq,Wk}=buildW(cond,0.35,-0.45);
  const Omega=mm(Wq,tr(Wk));

  const orig = dot(xd, mv(mm(mm(Wq,Rd),mm(tr(Rs),tr(Wk))), xs));

  const Md = mm(mm(Wq,Rd), inv2(Wq));
  const Ms = mm(mm(inv2(tr(Wk)), Rs), tr(Wk));

  const qeff = mv(tr(Md), xd); // equivalent column representation of xd^T Md
  const keff = mv(Ms, xs);
  const reform = dot(qeff, mv(Omega, keff));

  const tr1 = {x:[0,qeff[0]], y:[0,qeff[1]], mode:'lines+markers+text', text:['','q_eff'], textposition:'top center', line:{color:'#1f77b4', width:4}, xaxis:'x', yaxis:'y', name:'qeff'};
  const tr2 = {x:[0,keff[0]], y:[0,keff[1]], mode:'lines+markers+text', text:['','k_eff'], textposition:'bottom center', line:{color:'#d62728', width:4}, xaxis:'x', yaxis:'y', name:'keff'};

  const tr3 = {
    z:[[Omega[0][0],Omega[0][1]],[Omega[1][0],Omega[1][1]]],
    x:['c1','c2'], y:['r1','r2'], type:'heatmap', colorscale:'Blues', showscale:false,
    xaxis:'x2', yaxis:'y2'
  };

  const layout={
    title:'RoPE intuition: position changes vectors (q_eff, k_eff) while Omega stays fixed',
    paper_bgcolor:'#fff', plot_bgcolor:'#fff',
    margin:{l:30,r:20,t:56,b:40}, showlegend:false,
    xaxis:{domain:[0,0.56], range:[-2,2], zeroline:true, gridcolor:'#eee', title:'Effective vector space'},
    yaxis:{domain:[0,1], range:[-2,2], zeroline:true, gridcolor:'#eee', scaleanchor:'x', scaleratio:1},
    xaxis2:{domain:[0.66,1], title:'Fixed Omega'},
    yaxis2:{domain:[0.25,0.85]},
    annotations:[
      {xref:'paper',yref:'paper',x:0.27,y:1.02,text:'Md and Ms depend on positions',showarrow:false,font:{size:13}},
      {xref:'paper',yref:'paper',x:0.83,y:1.02,text:'One shared bilinear map',showarrow:false,font:{size:13}},
      {xref:'paper',yref:'paper',x:0.83,y:0.16,text:'Omega = Wq Wk^T (constant)',showarrow:false,font:{size:12,color:'#333'}}
    ]
  };

  Plotly.react('plot',[tr1,tr2,tr3],layout,{displayModeBar:false, responsive:true});

  const err = Math.abs(orig-reform);
  document.getElementById('metrics').innerHTML =
    '<b>Original RoPE score</b>: '+orig.toFixed(8)+
    ' &nbsp; | &nbsp; <b>Reformulated score</b>: '+reform.toFixed(8)+
    ' &nbsp; | &nbsp; <b>Absolute error</b>: '+err.toExponential(3)+
    '<br/><span style="color:#444">Move theta_d/theta_s: vectors move, but Omega stays fixed.</span>';
}
['td','ts','cond'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
draw();
</script>
</body>
</html>
